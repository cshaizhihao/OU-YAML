services:
  ou-yaml:
    image: ou-yaml:local
    build:
      context: .
      args:
        BUILD_COMMIT: "${OU_YAML_BUILD_COMMIT:-unknown}"
    container_name: ou-yaml
    restart: unless-stopped
    expose:
      - "8787"
    environment:
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD_B64: "${ADMIN_PASSWORD_B64:?ADMIN_PASSWORD_B64 is required}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      APP_ORIGIN: "${APP_ORIGIN:-}"
    volumes:
      - ./data:/app/data
      - /var/log/ou-yaml:/var/log/ou-yaml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
